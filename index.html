/* 낙엽 + 직직이 떨어지기 */
const fall=$("#fall");
function spawn(init){
 const e=document.createElement("div");e.className="f";
 const ch=Math.random()<.22;
 const sz=ch?34+Math.random()*34:14+Math.random()*40;
 if(ch){const i=document.createElement("img");i.src=IMGS[Math.random()*IMGS.length|0];i.style.cssText="width:"+sz*2.25+"px;display:block";e.appendChild(i)}
 else{e.textContent="🍁";e.style.fontSize=sz+"px"}
 const dur=8+Math.random()*9;
 e.style.left=Math.random()*100+"vw";
 e.style.setProperty("--dx",(Math.random()*160-80)+"px");
 e.style.setProperty("--rot",(Math.random()*720-360)+"deg");
 e.style.animation=`drop ${dur}s linear ${init?-Math.random()*dur:0}s 1 forwards`;
 fall.appendChild(e);setTimeout(()=>e.remove(),dur*1000+500);
}
for(let i=0;i<30;i++)spawn(true);
setInterval(()=>spawn(false),520);

let cur=1;
function go(n){cur=n;document.querySelectorAll(".pg").forEach(p=>p.classList.remove("show"));$("#p"+n).classList.add("show");
 $("#back").style.display=n>1?"block":"none";if(n==2)cover(false);if(n==3)startBye();$("#msg").textContent=""}
$("#back").onclick=()=>go(cur-1);

/* 페이지1 */
let cat="한식";
function render(){
 $("#foods").innerHTML="";
 FOODS[cat].forEach(([n,em])=>{
  const b=document.createElement("button");b.className="food"+(S.foods.includes(n)?" on":"");b.textContent=n+" "+em;
  b.onclick=()=>{S.foods=S.foods.includes(n)?S.foods.filter(x=>x!==n):[...S.foods,n];render()};
  $("#foods").appendChild(b)});
 $("#sel").textContent="선택한 음식: "+(S.foods.join(", ")||"없음");
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");cat=b.dataset.c;render()});
$("#n1").onclick=()=>go(2);
render();

/* 페이지2: O가 앞으로 나와 X를 가림 */
const O=$("#O"),X=$("#X"),box=$("#oxbox");
function cover(on){O.style.transform=on?`translate(${X.offsetLeft-O.offsetLeft}px,${X.offsetTop-O.offsetTop}px)`:"none"}
box.addEventListener("mousemove",e=>{const r=X.getBoundingClientRect(),m=90;
 cover(e.clientX>r.left-m&&e.clientX<r.right+m&&e.clientY>r.top-m&&e.clientY<r.bottom+m)});
box.addEventListener("mouseleave",()=>cover(false));
X.addEventListener("click",e=>{e.preventDefault();e.stopPropagation()});
O.onclick=()=>{S.cafe="O";go(3);startBye()};

/* 페이지3 */
AFTER.forEach((t,i)=>{
 const b=document.createElement("button");b.className="opt";b.textContent=t;
 if(i==0)b.id="bye";
 b.onclick=()=>{if(i==0)return;S.after=t;go(4)};
 $("#opts").appendChild(b)});
function startBye(){const b=$("#bye");b.classList.remove("gone");void b.offsetWidth;setTimeout(()=>b.classList.add("gone"),50)}

/* 페이지4: 설문 내역 이미지 저장 */
const FF='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
function wrap(x,text,max){const out=[];let line="";for(const ch of text){if(x.measureText(line+ch).width>max){out.push(line);line=ch}else line+=ch}out.push(line);return out}
function makeImage(){
 const rows=[["1. 땡기는 음식은 : ",S.foods.join(", ")||"-"],["2. 밥 먹고 카페를 간다 : ",S.cafe||"-"],["3. 카페 다음은 : ",S.after||"-"]];
 const c=document.createElement("canvas"),x=c.getContext("2d");c.width=800;x.font="26px "+FF;
 const laid=rows.map(([k,v])=>wrap(x,k+v,680));
 const H=230+laid.reduce((a,l)=>a+l.length*40+26,0);c.height=H;
 x.fillStyle="#fff";x.fillRect(0,0,800,H);x.strokeStyle="#000";x.lineWidth=3;x.strokeRect(20,20,760,H-40);
 x.fillStyle="#000";x.textAlign="center";x.font="44px "+FF;x.fillText("🍁 10/31 약속 🍁",400,95);
 x.font="22px "+FF;x.fillText("설문 내역",400,140);x.textAlign="left";x.font="26px "+FF;
 let y=210;laid.forEach(l=>{l.forEach(s=>{x.fillText(s,60,y);y+=40});y+=26});
 return new Promise(r=>c.toBlob(r,"image/png"));
}
async function saveBlob(blob,name){
 try{const d=await (window.claude&&claude.use?claude.use("downloads"):null);
  if(d){await d.save({filename:name,data:blob});return "saved"}}catch(e){if(e&&e.code==="declined")return "declined"}
 if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:"PNG 이미지",accept:{"image/png":[".png"]}}]});
  const w=await h.createWritable();await w.write(blob);await w.close();return "saved"}catch(e){if(e&&e.name==="AbortError")return "declined"}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return "saved";
}
$("#dl").onclick=async()=>{
 const m=$("#msg");
 try{localStorage.setItem("1031",JSON.stringify(S))}catch(e){}
 const r=await saveBlob(await makeImage(),"10-31_약속_설문내역.png");
 m.textContent=r==="saved"?"저장했어요! 저장한 이미지를 카톡방에 올려주세요.":"저장이 취소됐어요.";
};
</script></body></html>
